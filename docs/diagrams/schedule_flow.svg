      .period { font-size: 16px; font-weight: 700; fill: #102a43; }
      .gateId { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .gateTitle { font-size: 17px; font-weight: 700; fill: #102a43; } .gateLabel { font-size: 14px; font-weight: 700; fill: #102a43; }
      .cardTitle { font-size: 16px; font-weight: 700; fill: #102a43; } .body { font-size: 14px; }
