<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1160" width="1500" height="1160" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">2027 Navigation Data and VSLAM: who does what</title>
  <desc id="d">Three lanes (Hedgie: VSLAM and map research; Wobbles: data synthesis and sensor evidence; Bedrawn: integration and handoff) across four phases: shared preflight, parallel work, integration gate, package conversion, followed by what passes between people.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
    <style>
      text { fill: #243b53; }
      .title { font-size: 27px; font-weight: 700; fill: #102a43; } .subtitle { font-size: 15px; fill: #486581; }
      .section { font-size: 18px; font-weight: 700; fill: #102a43; }
      .phase { font-size: 17px; font-weight: 700; fill: #102a43; } .phaseSub { font-size: 13px; fill: #486581; }
      .lane { font-size: 20px; font-weight: 700; } .laneRole { font-size: 13px; font-weight: 700; fill: #102a43; }
      .cardTitle { font-size: 16px; font-weight: 700; fill: #102a43; } .body { font-size: 14px; }
      .note { font-size: 13px; font-style: italic; fill: #486581; } .handoff { font-size: 16px; font-weight: 700; }
      .chip { font-size: 10.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.4px; }
    </style>
  </defs>
  <rect width="1500" height="1160" fill="#f8fafc"/>
  <rect x="24" y="16" width="1452" height="76" rx="12" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5"/>
  <text x="48" y="50" class="title">2027 Navigation Data &amp; VSLAM: who does what</text>
  <text x="48" y="77" class="subtitle">Three people start in parallel, then prove one replayable bundle for the next subteam.</text>
  <rect x="216" y="112" width="232" height="58" rx="12" fill="#e6fcf5" stroke="#38a169" stroke-width="2"/>
  <text x="332" y="137" class="phase" text-anchor="middle">0 · Shared preflight</text>
  <text x="332" y="158" class="phaseSub" text-anchor="middle">small, required</text>
  <rect x="470" y="112" width="440" height="58" rx="12" fill="#ebf8ff" stroke="#3182ce" stroke-width="2"/>
  <text x="690" y="137" class="phase" text-anchor="middle">1 · Parallel work</text>
  <text x="690" y="158" class="phaseSub" text-anchor="middle">everyone starts at once</text>
  <rect x="932" y="112" width="272" height="58" rx="12" fill="#fffaf0" stroke="#dd6b20" stroke-width="2"/>
  <text x="1068" y="137" class="phase" text-anchor="middle">2 · Integration gate</text>
  <text x="1068" y="158" class="phaseSub" text-anchor="middle">prove it fits together</text>
  <rect x="1226" y="112" width="244" height="58" rx="12" fill="#faf5ff" stroke="#805ad5" stroke-width="2"/>
  <text x="1348" y="137" class="phase" text-anchor="middle">3 · Package conversion</text>
  <text x="1348" y="158" class="phaseSub" text-anchor="middle">only what is proven</text>
  <rect x="24" y="192" width="170" height="231" rx="12" fill="#f4f0ff" stroke="#7a5cc0" stroke-width="2"/>
  <text x="109" y="230" class="lane" text-anchor="middle" style="fill:#5b3c9b">HEDGIE</text>
  <text x="109" y="256" class="laneRole" text-anchor="middle">VSLAM and map</text>
  <text x="109" y="274" class="laneRole" text-anchor="middle">research</text>
  <rect x="470" y="192" width="440" height="231" rx="12" fill="#ffffff" stroke="#7a5cc0" stroke-width="2"/>
  <text x="486" y="222" class="cardTitle">Offline SLAM benchmark</text>
  <rect x="486" y="241" width="50" height="17" rx="4" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="0"/>
  <text x="511" y="253" class="chip" text-anchor="middle">IN</text>
  <text x="548" y="253" class="body">Recorded session files (or a labelled fixture)</text>
  <rect x="486" y="272" width="50" height="17" rx="4" fill="#4a5568" stroke="#4a5568" stroke-width="0"/>
  <text x="511" y="284" class="chip" text-anchor="middle">DOES</text>
  <text x="548" y="284" class="body">Build visual-only SLAM, loop closures and a</text>
  <text x="548" y="303" class="body">map</text>
  <rect x="486" y="322" width="50" height="17" rx="4" fill="#2f855a" stroke="#2f855a" stroke-width="0"/>
  <text x="511" y="334" class="chip" text-anchor="middle">OUT</text>
  <text x="548" y="334" class="body">Trajectory, map and metrics compared with the</text>
  <text x="548" y="353" class="body">ZED baseline</text>
  <rect x="486" y="372" width="50" height="17" rx="4" fill="#c05621" stroke="#c05621" stroke-width="0"/>
  <text x="511" y="384" class="chip" text-anchor="middle">NEEDS</text>
  <text x="548" y="384" class="body">Nothing to start; a real session from Wobbles</text>
  <text x="548" y="403" class="body">later</text>
  <path d="M912 228 L929 228" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="24" y="445" width="170" height="212" rx="12" fill="#e6fffa" stroke="#1f8a7e" stroke-width="2"/>
  <text x="109" y="483" class="lane" text-anchor="middle" style="fill:#167567">WOBBLES</text>
  <text x="109" y="509" class="laneRole" text-anchor="middle">Data synthesis and</text>
  <text x="109" y="527" class="laneRole" text-anchor="middle">sensor evidence</text>
  <rect x="470" y="445" width="440" height="212" rx="12" fill="#ffffff" stroke="#1f8a7e" stroke-width="2"/>
  <text x="486" y="475" class="cardTitle">IMU validation and recording</text>
  <rect x="486" y="494" width="50" height="17" rx="4" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="0"/>
  <text x="511" y="506" class="chip" text-anchor="middle">IN</text>
  <text x="548" y="506" class="body">ZED camera and IMU, live or from an SVO</text>
  <rect x="486" y="525" width="50" height="17" rx="4" fill="#4a5568" stroke="#4a5568" stroke-width="0"/>
  <text x="511" y="537" class="chip" text-anchor="middle">DOES</text>
  <text x="548" y="537" class="body">Record sessions, check IMU timing and axes,</text>
  <text x="548" y="556" class="body">compare camera-only with IMU-fused</text>
  <rect x="486" y="575" width="50" height="17" rx="4" fill="#2f855a" stroke="#2f855a" stroke-width="0"/>
  <text x="511" y="587" class="chip" text-anchor="middle">OUT</text>
  <text x="548" y="587" class="body">Replayable session, manifest, TF and IMU</text>
  <text x="548" y="606" class="body">quality report</text>
  <rect x="486" y="625" width="50" height="17" rx="4" fill="#c05621" stroke="#c05621" stroke-width="0"/>
  <text x="511" y="637" class="chip" text-anchor="middle">NEEDS</text>
  <text x="548" y="637" class="body">The shared preflight</text>
  <path d="M912 481 L929 481" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="24" y="679" width="170" height="231" rx="12" fill="#fff5e6" stroke="#c27a00" stroke-width="2"/>
  <text x="109" y="717" class="lane" text-anchor="middle" style="fill:#a65d00">BEDRAWN</text>
  <text x="109" y="743" class="laneRole" text-anchor="middle">Integration and</text>
  <text x="109" y="761" class="laneRole" text-anchor="middle">handoff</text>
  <rect x="470" y="679" width="440" height="231" rx="12" fill="#ffffff" stroke="#c27a00" stroke-width="2"/>
  <text x="486" y="709" class="cardTitle">Handoff bundle fixture</text>
  <rect x="486" y="728" width="50" height="17" rx="4" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="0"/>
  <text x="511" y="740" class="chip" text-anchor="middle">IN</text>
  <text x="548" y="740" class="body">Synthetic data now; Wobbles' topics later</text>
  <rect x="486" y="759" width="50" height="17" rx="4" fill="#4a5568" stroke="#4a5568" stroke-width="0"/>
  <text x="511" y="771" class="chip" text-anchor="middle">DOES</text>
  <text x="548" y="771" class="body">Turn depth into obstacle scans and write down</text>
  <text x="548" y="790" class="body">the handoff contract</text>
  <rect x="486" y="809" width="50" height="17" rx="4" fill="#2f855a" stroke="#2f855a" stroke-width="0"/>
  <text x="511" y="821" class="chip" text-anchor="middle">OUT</text>
  <text x="548" y="821" class="body">Replayable obstacle bundle with rover</text>
  <text x="548" y="840" class="body">footprint</text>
  <rect x="486" y="859" width="50" height="17" rx="4" fill="#c05621" stroke="#c05621" stroke-width="0"/>
  <text x="511" y="871" class="chip" text-anchor="middle">NEEDS</text>
  <text x="548" y="871" class="body">Wobbles' topic and TF contract at the gate;</text>
  <text x="548" y="890" class="body">Hedgie's map is optional</text>
  <path d="M912 715 L929 715" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="216" y="192" width="232" height="718" rx="12" fill="#ffffff" stroke="#38a169" stroke-width="2"/>
  <text x="232" y="222" class="cardTitle">Check the basics once</text>
  <rect x="232" y="241" width="50" height="17" rx="4" fill="#4a5568" stroke="#4a5568" stroke-width="0"/>
  <text x="257" y="253" class="chip" text-anchor="middle">DOES</text>
  <text x="294" y="253" class="body">Agree the</text>
  <text x="294" y="272" class="body">camera/IMU clock,</text>
  <text x="294" y="291" class="body">the frame names,</text>
  <text x="294" y="310" class="body">and the mounting</text>
  <text x="294" y="329" class="body">geometry</text>
  <rect x="232" y="348" width="50" height="17" rx="4" fill="#2f855a" stroke="#2f855a" stroke-width="0"/>
  <text x="257" y="360" class="chip" text-anchor="middle">OUT</text>
  <text x="294" y="360" class="body">One replayable</text>
  <text x="294" y="379" class="body">recording plus a</text>
  <text x="294" y="398" class="body">small session</text>
  <text x="294" y="417" class="body">manifest</text>
  <rect x="232" y="436" width="50" height="17" rx="4" fill="#c05621" stroke="#c05621" stroke-width="0"/>
  <text x="257" y="448" class="chip" text-anchor="middle">NEEDS</text>
  <text x="294" y="448" class="body">ZED camera or an</text>
  <text x="294" y="467" class="body">SVO file; ROS 2</text>
  <text x="294" y="486" class="body">Jazzy set up</text>
  <text x="232" y="512" class="note">Not a camera-only phase. It</text>
  <text x="232" y="530" class="note">only gives IMU data meaning.</text>
  <rect x="932" y="192" width="272" height="718" rx="12" fill="#ffffff" stroke="#dd6b20" stroke-width="2"/>
  <text x="948" y="222" class="cardTitle">One session, all three</text>
  <rect x="948" y="241" width="50" height="17" rx="4" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="0"/>
  <text x="973" y="253" class="chip" text-anchor="middle">IN</text>
  <text x="1010" y="253" class="body">Each person's finished</text>
  <text x="1010" y="272" class="body">parallel work</text>
  <rect x="948" y="291" width="50" height="17" rx="4" fill="#4a5568" stroke="#4a5568" stroke-width="0"/>
  <text x="973" y="303" class="chip" text-anchor="middle">DOES</text>
  <text x="1010" y="303" class="body">Freeze the manifest,</text>
  <text x="1010" y="322" class="body">replay one session end</text>
  <text x="1010" y="341" class="body">to end, swap synthetic</text>
  <text x="1010" y="360" class="body">data for real topics,</text>
  <text x="1010" y="379" class="body">pick one owner of map →</text>
  <text x="1010" y="398" class="body">odom</text>
  <rect x="948" y="417" width="50" height="17" rx="4" fill="#2f855a" stroke="#2f855a" stroke-width="0"/>
  <text x="973" y="429" class="chip" text-anchor="middle">OUT</text>
  <text x="1010" y="429" class="body">One validated</text>
  <text x="1010" y="448" class="body">Navigation Data &amp; VSLAM</text>
  <text x="1010" y="467" class="body">Handoff Bundle</text>
  <text x="948" y="493" class="note">Passes only if time and frames</text>
  <text x="948" y="511" class="note">agree, replay repeats, and there</text>
  <text x="948" y="529" class="note">is no duplicate TF owner.</text>
  <rect x="1226" y="192" width="244" height="718" rx="12" fill="#ffffff" stroke="#805ad5" stroke-width="2"/>
  <text x="1242" y="222" class="cardTitle">Make it real ROS 2</text>
  <rect x="1242" y="241" width="50" height="17" rx="4" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="0"/>
  <text x="1267" y="253" class="chip" text-anchor="middle">IN</text>
  <text x="1304" y="253" class="body">Slices that passed</text>
  <text x="1304" y="272" class="body">the gate</text>
  <rect x="1242" y="291" width="50" height="17" rx="4" fill="#4a5568" stroke="#4a5568" stroke-width="0"/>
  <text x="1267" y="303" class="chip" text-anchor="middle">DOES</text>
  <text x="1304" y="303" class="body">Move each proven</text>
  <text x="1304" y="322" class="body">slice into its ROS 2</text>
  <text x="1304" y="341" class="body">package, one slice</text>
  <text x="1304" y="360" class="body">per pull request</text>
  <rect x="1242" y="379" width="50" height="17" rx="4" fill="#2f855a" stroke="#2f855a" stroke-width="0"/>
  <text x="1267" y="391" class="chip" text-anchor="middle">OUT</text>
  <text x="1304" y="391" class="body">Final packages in</text>
  <text x="1304" y="410" class="body">2027_build/</text>
  <text x="1242" y="436" class="note">No migrating legacy code just</text>
  <text x="1242" y="454" class="note">to tidy folders.</text>
  <path d="M450 228 L467 228" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1206 228 L1223 228" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="24" y="950" class="section">What passes between people</text>
  <rect x="24" y="966" width="469.333" height="78" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="40" y="994" class="handoff" style="fill:#167567">Wobbles</text>
  <text x="123" y="994" class="handoff" style="fill:#102a43">→</text>
  <text x="149" y="994" class="handoff" style="fill:#5b3c9b">Hedgie</text>
  <text x="40" y="1018" class="body">session files: recording, manifest, calibration</text>
  <rect x="515.333" y="966" width="469.333" height="78" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="531.333" y="994" class="handoff" style="fill:#167567">Wobbles</text>
  <text x="614.333" y="994" class="handoff" style="fill:#102a43">→</text>
  <text x="640.333" y="994" class="handoff" style="fill:#a65d00">Bedrawn</text>
  <text x="531.333" y="1018" class="body">ROS topics, TF and bag replay</text>
  <rect x="1006.67" y="966" width="469.333" height="78" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1022.67" y="994" class="handoff" style="fill:#5b3c9b">Hedgie</text>
  <text x="1094.67" y="994" class="handoff" style="fill:#102a43">→</text>
  <text x="1120.67" y="994" class="handoff" style="fill:#a65d00">Bedrawn</text>
  <text x="1022.67" y="1018" class="body">map export (optional)</text>
  <rect x="24" y="1074" width="1452" height="62" rx="12" fill="#edf2f7" stroke="#bcccdc" stroke-width="1"/>
  <text x="44" y="1101" class="body">Hands off to the next subteam: costmaps, route planning and motors are theirs, not ours. GPS comes later, after this works.</text>
  <text x="44" y="1123" class="body">Rule: exactly one component owns each TF frame link. In particular, only one may publish map → odom.</text>
</svg>
