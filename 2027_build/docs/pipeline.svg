<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1010" width="1500" height="1010" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <title>2027 Autonomous Navigation: IMU-first parallel workstream timeline</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
    <style>
      .title { font-size: 25px; font-weight: 700; fill: #102a43; } .subtitle { font-size: 14px; fill: #486581; }
      .phase { font-size: 15px; font-weight: 700; fill: #102a43; } .phaseSub { font-size: 11px; fill: #486581; }
      .lane { font-size: 18px; font-weight: 700; } .boxTitle { font-size: 15px; font-weight: 700; fill: #102a43; }
      .boxText { font-size: 12.5px; fill: #243b53; } .note { font-size: 12px; fill: #334e68; } .small { font-size: 11px; fill: #486581; }
    </style>
  </defs>
  <rect width="1500" height="1010" fill="#f8fafc"/>
  <rect x="20" y="16" width="1460" height="72" rx="12" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5"/>
  <text x="46" y="49" class="title">2027 Autonomous Navigation · IMU-first, parallel delivery</text>
  <text x="46" y="72" class="subtitle">Short measurement preflight → Wobbles leads IMU validation while Hedgie and Bedrawn work independently → integrate proven handoffs → convert validated slices to ROS packages.</text>
  <rect x="250" y="112" width="220" height="74" rx="10" fill="#e6fcf5" stroke="#38a169" stroke-width="2"/>
  <text x="360.0" y="141" class="phase" text-anchor="middle">0 · Shared preflight</text>
  <text x="360.0" y="162" class="phaseSub" text-anchor="middle">clock, frames, one replayable session</text>
  <rect x="505" y="112" width="400" height="74" rx="10" fill="#ebf8ff" stroke="#3182ce" stroke-width="2"/>
  <text x="705.0" y="141" class="phase" text-anchor="middle">1 · Parallel individual milestones</text>
  <text x="705.0" y="162" class="phaseSub" text-anchor="middle">Wobbles starts substantive IMU work</text>
  <rect x="940" y="112" width="240" height="74" rx="10" fill="#fffaf0" stroke="#dd6b20" stroke-width="2"/>
  <text x="1060.0" y="141" class="phase" text-anchor="middle">2 · Integration gate</text>
  <text x="1060.0" y="162" class="phaseSub" text-anchor="middle">one contract, one replay session</text>
  <rect x="1215" y="112" width="245" height="74" rx="10" fill="#faf5ff" stroke="#805ad5" stroke-width="2"/>
  <text x="1337.5" y="141" class="phase" text-anchor="middle">3 · Package conversion</text>
  <text x="1337.5" y="162" class="phaseSub" text-anchor="middle">validated vertical slices only</text>
  <path d="M470 149 H495 M905 149 H930 M1180 149 H1205" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="24" y="220" width="192" height="164" rx="12" fill="#f4f0ff" stroke="#7a5cc0" stroke-width="2"/>
  <text x="120" y="266" class="lane" fill="#5b3c9b" text-anchor="middle">HEDGIE</text>
  <text x="120" y="290" class="note" text-anchor="middle">Offline SLAM +</text>
  <text x="120" y="309" class="note" text-anchor="middle">semantic maps</text>
  <text x="120" y="347" class="small" text-anchor="middle">Starts from files/fixtures</text>
  <rect x="24" y="423" width="192" height="164" rx="12" fill="#e6fffa" stroke="#1f8a7e" stroke-width="2"/>
  <text x="120" y="469" class="lane" fill="#167567" text-anchor="middle">WOBBLES</text>
  <text x="120" y="493" class="note" text-anchor="middle">Sensors, TF,</text>
  <text x="120" y="512" class="note" text-anchor="middle">recording, localization</text>
  <text x="120" y="550" class="small" text-anchor="middle">Data-contract owner</text>
  <rect x="24" y="626" width="192" height="164" rx="12" fill="#fff5e6" stroke="#c27a00" stroke-width="2"/>
  <text x="120" y="672" class="lane" fill="#a65d00" text-anchor="middle">BEDRAWN</text>
  <text x="120" y="696" class="note" text-anchor="middle">Costmap-ready inputs,</text>
  <text x="120" y="715" class="note" text-anchor="middle">replay handoff</text>
  <text x="120" y="753" class="small" text-anchor="middle">External team consumes</text>
  <rect x="250" y="220" width="220" height="164" rx="10" fill="#ffffff" stroke="#38a169" stroke-width="2"/>
  <text x="268" y="250" class="boxTitle">Minimum evidence only</text>
  <text x="268" y="278" class="boxText">• camera/IMU clock convention</text>
  <text x="268" y="301" class="boxText">• base → camera → IMU frames</text>
  <text x="268" y="324" class="boxText">• one SVO/bag or replay path</text>
  <text x="268" y="347" class="boxText">• minimal session manifest</text>
  <text x="268" y="369" class="small">Not a prolonged camera-only phase.</text>
  <rect x="250" y="423" width="220" height="164" rx="10" fill="#ffffff" stroke="#38a169" stroke-width="2"/>
  <text x="268" y="453" class="boxTitle">Wobbles preflight</text>
  <text x="268" y="481" class="boxText">• timing and physical frames</text>
  <text x="268" y="504" class="boxText">• replayable camera/IMU run</text>
  <text x="268" y="527" class="boxText">• baseline trajectory retained</text>
  <text x="268" y="572" class="small">Enables IMU interpretation.</text>
  <rect x="250" y="626" width="220" height="164" rx="10" fill="#ffffff" stroke="#38a169" stroke-width="2"/>
  <text x="268" y="656" class="boxTitle">Bedrawn preflight</text>
  <text x="268" y="684" class="boxText">• agree frame/topic names</text>
  <text x="268" y="707" class="boxText">• create synthetic source</text>
  <text x="268" y="775" class="small">Does not wait for hardware.</text>
  <rect x="505" y="220" width="400" height="164" rx="10" fill="#ffffff" stroke="#7a5cc0" stroke-width="2"/>
  <text x="523" y="250" class="boxTitle">Visual-only benchmark (independent)</text>
  <text x="523" y="278" class="boxText">• RGB-D fixture/recording → trajectory, loop closures, map</text>
  <text x="523" y="301" class="boxText">• quantify against ZED baseline</text>
  <text x="523" y="324" class="boxText">• prepare optional visual-inertial comparison input</text>
  <text x="523" y="369" class="small">Hedgie does not wait for live ROS, IMU, or the costmap team.</text>
  <rect x="505" y="423" width="400" height="164" rx="10" fill="#ffffff" stroke="#1f8a7e" stroke-width="3"/>
  <text x="523" y="453" class="boxTitle">IMU integration and validation (Wobbles first)</text>
  <text x="523" y="481" class="boxText">• publish/record IMU; validate axes, rate, bias, vibration</text>
  <text x="523" y="504" class="boxText">• matched camera-only vs IMU-fused routes</text>
  <text x="523" y="527" class="boxText">• decide whether additional filtering is warranted</text>
  <text x="523" y="572" class="small">Demonstrate benefit; do not assume it.</text>
  <rect x="505" y="626" width="400" height="164" rx="10" fill="#ffffff" stroke="#c27a00" stroke-width="2"/>
  <text x="523" y="656" class="boxTitle">Costmap-ready input bundle (independent)</text>
  <text x="523" y="684" class="boxText">• depth/point cloud → LaserScan obstacle input</text>
  <text x="523" y="707" class="boxText">• replay, TF/localization context, footprint metadata</text>
  <text x="523" y="775" class="small">External team builds costmap and chooses routes.</text>
  <rect x="940" y="220" width="240" height="570" rx="10" fill="#ffffff" stroke="#dd6b20" stroke-width="2"/>
  <text x="958" y="252" class="boxTitle">Prove the handoffs</text>
  <text x="958" y="287" class="boxText">1. Freeze manifest schema</text>
  <text x="958" y="313" class="boxText">2. Verify topic, QoS, TF</text>
  <text x="958" y="339" class="boxText">3. Replay one session</text>
  <text x="958" y="365" class="boxText">4. Hedgie: visual vs VI</text>
  <text x="958" y="391" class="boxText">5. Bedrawn: swap input</text>
  <text x="958" y="417" class="boxText">6. One map → odom owner</text>
  <line x1="958" y1="448" x2="1162" y2="448" stroke="#fbd38d" stroke-width="2"/>
  <text x="958" y="479" class="boxTitle">Gate is passed only if</text>
  <text x="958" y="510" class="boxText">• frames and time agree</text>
  <text x="958" y="535" class="boxText">• playback is repeatable</text>
  <text x="958" y="560" class="boxText">• no duplicate TF owner</text>
  <text x="958" y="585" class="boxText">• input bundle replays cleanly</text>
  <text x="958" y="623" class="small">GPS follows only after this gate.</text>
  <rect x="1215" y="220" width="245" height="570" rx="10" fill="#ffffff" stroke="#805ad5" stroke-width="2"/>
  <text x="1233" y="252" class="boxTitle">Convert what is proven</text>
  <text x="1233" y="288" class="boxText">• rover_camera_ai</text>
  <text x="1233" y="314" class="boxText">• rover_localization</text>
  <text x="1233" y="340" class="boxText">• rover_navigation_inputs</text>
  <text x="1233" y="366" class="boxText">• rover_bringup</text>
  <line x1="1233" y1="397" x2="1442" y2="397" stroke="#d6bcfa" stroke-width="2"/>
  <text x="1233" y="429" class="boxTitle">Rules</text>
  <text x="1233" y="460" class="boxText">• minimal scaffolding may</text>
  <text x="1233" y="484" class="boxText">  exist earlier</text>
  <text x="1233" y="508" class="boxText">• no legacy migration just</text>
  <text x="1233" y="532" class="boxText">  for folder uniformity</text>
  <text x="1233" y="556" class="boxText">• one demonstrated vertical</text>
  <text x="1233" y="580" class="boxText">  slice per conversion PR</text>
  <text x="1233" y="623" class="small">Then pass stable inputs downstream.</text>
  <path d="M470 302 H495" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M905 302 H930" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1180 302 H1205" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M470 505 H495" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M905 505 H930" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1180 505 H1205" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M470 708 H495" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M905 708 H930" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1180 708 H1205" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="250" y="835" width="1210" height="120" rx="12" fill="#edf2f7" stroke="#bcccdc" stroke-width="1"/>
  <text x="275" y="867" class="boxTitle">Shared rule across the whole timeline</text>
  <text x="275" y="895" class="boxText">Hedgie's visual baseline and Bedrawn's costmap-ready input bundle are independent of Wobbles' IMU result. They all need the final sensor, frame, manifest, and map contracts for end-to-end integration.</text>
  <text x="275" y="922" class="boxText">Bedrawn hands inputs to the external costmap/planning team; that team selects costmaps and routes. No motors are commanded.</text>
</svg>
